name: Daily Food Order
on:
  schedule:
    - cron: '30 6 * * 1-6'
  workflow_dispatch: {}
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit food form
        env:
          COOKIES: ${{ secrets.GOOGLE_COOKIES }}
        run: |
          STATUS=$(curl -s -o response.txt -w "%{http_code}" -L \
            -X POST \
            --cookie "$COOKIES" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            -e "https://docs.google.com/forms/d/e/1FAIpQLScOts6_-O5PvbxVO17vEcUmKyTVFD6vzSdV5naX0LH6uiko1g/viewform" \
            --data-urlencode "entry.644673588=Mohit Sandesh Desai" \
            --data-urlencode "entry.1612255277=SINGLE TOWER BOYS" \
            --data-urlencode "entry.239864929=Jaynagar" \
            --data-urlencode "entry.1606336139=No" \
            "https://docs.google.com/forms/d/e/1FAIpQLScOts6_-O5PvbxVO17vEcUmKyTVFD6vzSdV5naX0LH6uiko1g/formResponse")
          echo "Status: $STATUS"
          head -c 500 response.txt
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 302 ]; then
            echo "Food form submitted!"
          else
            echo "Failed: $STATUS"
            exit 1
          fi
