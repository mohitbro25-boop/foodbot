name: Daily Food Order
on:
  schedule:
    - cron: '30 6 * * 1-6'
  workflow_dispatch: {}
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Submit form
        env:
          GOOGLE_COOKIES: ${{ secrets.GOOGLE_COOKIES }}
        run: |
          cat << 'EOF' > submit.js
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext();
            
            const cookiesStr = process.env.GOOGLE_COOKIES;
            if (cookiesStr) {
              const cookies = cookiesStr.split(';').map(c => {
                const [name, ...rest] = c.trim().split('=');
                return {
                  name,
                  value: rest.join('='),
                  url: 'https://docs.google.com'
                };
              }).filter(c => c.name);
              await context.addCookies(cookies);
            }
            
            const page = await context.newPage();
            await page.goto('https://docs.google.com/forms/d/e/1FAIpQLScOts6_-O5PvbxVO17vEcUmKyTVFD6vzSdV5naX0LH6uiko1g/viewform');
            await page.waitForSelector('form');
            
            const nameInput = await page.$('input[type="text"]');
            if (nameInput) await nameInput.fill('Mohit Sandesh Desai');
            
            const labels = await page.$$('label');
            for (const label of labels) {
              const text = await label.innerText();
              if (text.includes('SINGLE TOWER BOYS') || text.includes('Jaynagar') || (text === 'No' && !text.includes('Yes'))) {
                await label.click();
              }
            }
            
            await page.click('//span[contains(text(), "Submit")]');
            await page.waitForLoadState('networkidle');
            console.log('Food form submitted!');
            await browser.close();
          })();
          EOF
          node submit.js
