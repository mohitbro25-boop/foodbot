name: Daily Food Order
on:
  schedule:
    - cron: '30 6 * * 1-6'
  workflow_dispatch: {}
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit food form
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -b "${{ secrets.GOOGLE_COOKIES }}" \
            -d "entry.644673588=Mohit+Sandesh+Desai" \
            -d "entry.1612255277=SINGLE+TOWER+BOYS" \
            -d "entry.239864929=Jaynagar" \
            -d "entry.1606336139=No" \
            "https://docs.google.com/forms/d/e/1FAIpQLScOts6_-O5PvbxVO17vEcUmKyTVFD6vzSdV5naX0LH6uiko1g/formResponse")
          echo "Response status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Food form submitted!"
          else
            echo "Failed: $STATUS"
            exit 1
          fi
